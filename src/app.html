<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#C90012">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Extintores · SOS FIRE</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
:root{
  --red:#C90012; --red-d:#9E000E; --red-soft:#FDECEC; --red-ink:#A3000F;
  --gray:#4A4A4A; --ink:#1F1F1F; --muted:#5C5C5C; --line:#E4E4E4;
  --bg:#F5F5F4; --card:#FFFFFF; --ok:#167C3A; --ok-soft:#E6F4EA;
  --warn:#8A4A00; --warn-soft:#FFF4E0; --warn-line:#F2C98A; --blue:#1A56C4; --blue-soft:#E8F0FE;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.35 Inter,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--red)}
.hide{display:none!important}
.muted{color:var(--muted)}
.sr{position:absolute;left:-9999px}

/* ---------- Comunes ---------- */
.btn{height:46px;border-radius:12px;border:1.5px solid var(--line);background:#fff;font-weight:700;padding:0 14px;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none;color:var(--ink);white-space:nowrap}
.btn.pri{background:var(--red);border-color:var(--red);color:#fff}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.xl{background:#107C41;border-color:#107C41;color:#fff}
.btn.ghost{color:var(--muted)}
.btn.sm{height:36px;font-size:13px;border-radius:9px;padding:0 10px}
.btn:active{filter:brightness(.95)}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:800;border-radius:999px;padding:2px 8px;white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.bad{background:var(--red-soft);color:var(--red-ink)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.pend{background:#EFEFEF;color:var(--muted)}
.pill.new{background:var(--blue-soft);color:var(--blue)}
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:12px;font-size:12.5px;font-weight:700;color:var(--muted)}
.field input,.field select,.field textarea{height:46px;border:1.5px solid var(--line);border-radius:10px;padding:0 12px;font-size:16px;font-weight:400;color:var(--ink);background:#fff;outline:none;width:100%}
.field textarea{height:auto;min-height:70px;padding:10px 12px;resize:vertical}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--red)}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px}
.card h3{margin:0 0 10px;font-size:15px;font-weight:800}
.lbl{font-size:11.5px;font-weight:800;color:var(--muted);letter-spacing:.05em;text-transform:uppercase}
.bar{height:8px;background:var(--line);border-radius:4px;overflow:hidden;display:flex}
.bar i{display:block;height:100%}
.av{flex:none;width:28px;height:28px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;background:var(--red-soft);color:var(--red-ink)}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}
.chipT{display:inline-flex;align-items:center;gap:6px;background:var(--bg);border-radius:999px;padding:3px 10px 3px 3px;font-size:13px;font-weight:700}
.chipT .av{width:24px;height:24px;font-size:10.5px}
.net{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;border-radius:999px;padding:2px 8px}
.net::before{content:'';width:7px;height:7px;border-radius:50%;background:currentColor}
.net.on{background:var(--ok-soft);color:var(--ok)} .net.off{background:var(--warn-soft);color:var(--warn)}

/* ---------- Pantallas de técnico (teléfono) ---------- */
.mob{max-width:560px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}
.top{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 16px 8px}
.brand img{height:26px}
.brand .r{display:flex;flex-direction:column;align-items:flex-end;gap:3px;min-width:0}
.brand .r b{font-size:13px;max-width:220px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.back{border:0;background:var(--bg);width:38px;height:38px;border-radius:10px;font-size:20px;font-weight:700;color:var(--gray);flex:none}
.prog{display:flex;justify-content:space-between;align-items:baseline;padding:2px 16px 6px;font-size:12px;font-weight:700;color:var(--muted)}
.prog b{color:var(--ink);font-size:13px;font-variant-numeric:tabular-nums}
.top .bar{margin:0 16px 10px;height:5px}
.sw{padding:0 12px 10px;display:flex;flex-direction:column;gap:9px}
.search{position:relative}
.search svg{position:absolute;left:12px;top:13px;width:20px;height:20px;color:var(--muted)}
.search input{width:100%;height:46px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);padding:0 40px 0 40px;font-size:16px;outline:none}
.search input:focus{border-color:var(--red);background:#fff}
.search input::-webkit-search-cancel-button{display:none}
.search .clr{position:absolute;right:6px;top:6px;width:34px;height:34px;border:0;background:none;font-size:20px;color:var(--muted)}
.hs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:1px}
.hs::-webkit-scrollbar{display:none}
.zchip{flex:none;height:34px;border-radius:10px;border:1.5px solid var(--line);background:#fff;color:var(--gray);font-size:13px;font-weight:700;padding:0 12px;white-space:nowrap}
.zchip.on{background:var(--red);border-color:var(--red);color:#fff}
.chip{flex:none;border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 11px;font-size:12.5px;font-weight:700;color:var(--muted);white-space:nowrap}
.chip.on{background:var(--gray);border-color:var(--gray);color:#fff}
.chip.bad{color:var(--red-ink)} .chip.warn{color:var(--warn);background:var(--warn-soft);border-color:var(--warn-line)}
.chip.on.bad,.chip.on.warn{background:var(--gray);border-color:var(--gray);color:#fff}
.list{flex:1;padding:10px 10px 140px;display:flex;flex-direction:column;gap:7px}
.zhead{font-size:11.5px;font-weight:800;color:var(--muted);letter-spacing:.05em;padding:8px 4px 2px;text-transform:uppercase}
.row{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 10px 10px 12px}
.row.ok{border-left:4px solid var(--ok)} .row.bad{border-left:4px solid var(--red)}
.row .num{flex:none;min-width:40px;text-align:center;font-weight:800;font-size:15px;color:var(--gray);background:var(--bg);border-radius:8px;padding:6px 4px;font-variant-numeric:tabular-nums}
.row .main{flex:1;min-width:0;border:0;background:none;text-align:left;padding:0;display:flex;flex-direction:column;gap:3px}
.row .t{font-weight:700;font-size:14.5px;overflow-wrap:anywhere}
.row .t mark{background:#FFF1B8;color:inherit;border-radius:3px}
.row .s{font-size:12px;color:var(--muted)}
.row .st{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:11.5px;color:var(--muted)}
.quick{flex:none;width:58px;height:44px;border-radius:10px;border:1.5px solid var(--ok);background:#fff;color:var(--ok);font-weight:800;font-size:14px}
.quick:active{background:var(--ok);color:#fff}
.quick.ed{border-color:var(--line);color:var(--gray);font-size:12.5px;width:auto;padding:0 9px}
.empty{text-align:center;color:var(--muted);padding:34px 16px}
.addbig{width:100%;margin-top:10px;border:1.5px dashed var(--red);background:#fff;color:var(--red);border-radius:12px;padding:13px;font-weight:800}
.fab{position:fixed;right:max(16px,calc(50% - 264px));bottom:84px;z-index:25;height:52px;border:0;border-radius:26px;background:var(--red);color:#fff;font-weight:800;font-size:15px;padding:0 18px;box-shadow:0 6px 18px rgba(201,0,18,.3)}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:24;background:#fff;border-top:1px solid var(--line);display:grid;grid-template-columns:1fr 1fr;height:64px;max-width:560px;margin:0 auto}
.nav button{border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--muted);font-size:12px;font-weight:700}
.nav button.on{color:var(--red)}
.nav svg{width:22px;height:22px}
.pad{padding:12px;display:flex;flex-direction:column;gap:12px;padding-bottom:110px}
.pcard{display:flex;flex-direction:column;gap:9px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:13px 14px;text-align:left;width:100%}
.pcard.hoy{border:2px solid var(--red)}
.pcard .h{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.pcard .n{font-size:15.5px;font-weight:800}
.pcard .d{font-size:12.5px;color:var(--muted)}
.foot{position:sticky;bottom:0;background:#fff;border-top:1px solid var(--line);padding:12px 16px 16px;display:flex;flex-direction:column;gap:6px}
.foot .btn{height:52px;font-size:16px;width:100%}
.foot small{font-size:12px;color:var(--muted);text-align:center}
.opt{border:1.5px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:3px;text-align:left;background:#fff;width:100%}
.opt.on{border:2px solid var(--red)}
.opt b{font-size:14.5px} .opt span{font-size:12.5px;color:var(--muted)}
.seg3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.segb{height:44px;border-radius:10px;border:1.5px solid var(--line);background:#fff;color:var(--gray);font-weight:700;font-size:13.5px}
.segb.on{background:var(--gray);border-color:var(--gray);color:#fff}
.sugg{border:1px solid var(--warn-line);background:var(--warn-soft);border-radius:10px;padding:10px 12px;margin:-4px 0 12px;display:flex;flex-direction:column;gap:6px}
.sugg .h{font-size:12.5px;font-weight:700;color:var(--warn)}
.sugg button{border:0;background:none;text-align:left;font-weight:700;font-size:14px;padding:2px 0}

/* Ficha (hoja inferior) */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.42);z-index:40;opacity:0;pointer-events:none;transition:opacity .18s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:50;max-width:560px;margin:0 auto;background:#fff;border-radius:18px 18px 0 0;transform:translateY(105%);transition:transform .22s ease;max-height:94vh;display:flex;flex-direction:column}
.sheet.on{transform:none}
.sheet:not(.on){visibility:hidden;transition:transform .22s ease,visibility 0s .22s}
.shb>*{flex-shrink:0}
.shh{display:flex;align-items:flex-start;gap:10px;padding:14px 16px 10px;border-bottom:1px solid var(--line)}
.shh .n{flex:none;background:var(--red);color:#fff;font-weight:800;border-radius:8px;padding:5px 9px}
.shh .t{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.shh .t b{font-size:16.5px;overflow-wrap:anywhere}
.shh .t span{font-size:12px;color:var(--muted)}
.linkb{border:0;background:none;color:var(--blue);font-weight:700;font-size:12.5px;padding:0;text-align:left}
.shb{overflow-y:auto;padding:12px 16px;display:flex;flex-direction:column;gap:12px}
.idg{background:var(--bg);border-radius:12px;padding:11px 13px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px 8px}
.idg div{display:flex;flex-direction:column;gap:1px;min-width:0}
.idg span{font-size:10.5px;font-weight:800;color:var(--muted)}
.idg b{font-size:14px;overflow-wrap:anywhere}
.allok{height:54px;border:0;border-radius:12px;background:var(--ok);color:#fff;font-weight:800;font-size:17px}
.editbar{background:#FFF7E6;border:1px solid #F5D9A8;color:#6B3D00;border-radius:10px;padding:8px 10px;font-size:13px}
.editbar.warn{background:var(--red-soft);border-color:#F3B7BC;color:#7A000A}
.crit{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.crit.wide{flex-direction:column;align-items:stretch}
.crit .l{font-size:14.5px;font-weight:600}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:6px;flex:none;width:176px}
.crit.wide .seg{width:auto}
.seg button{height:44px;border-radius:10px;border:1.5px solid var(--line);background:#fff;color:var(--gray);font-weight:700;font-size:14px}
.seg button.g{background:var(--ok);border-color:var(--ok);color:#fff;font-weight:800}
.seg button.b{background:var(--red);border-color:var(--red);color:#fff;font-weight:800}
.dates{border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:10px}
.dates .g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.dates .field{margin:0}
.dates input{height:42px;font-size:15px;padding:0 10px}
.qc{display:flex;flex-wrap:wrap;gap:6px}
.qc button{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:6px 10px;font-size:13px}
.qc button.on{background:var(--gray);border-color:var(--gray);color:#fff}
textarea.obs{width:100%;min-height:64px;border:1.5px solid var(--line);border-radius:10px;padding:10px;font-size:15px;resize:vertical;outline:none}
.shf{display:flex;gap:8px;padding:10px 16px 14px;border-top:1px solid var(--line)}
.shf .btn{height:50px}
.shf .btn.pri{flex:1}
.hint{font-size:12.5px;color:var(--warn);min-height:0}

/* ---------- Administrador (computadora) ---------- */
.adm{min-height:100vh;display:flex;flex-direction:column}
.ah{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
.ah .in{max-width:1200px;margin:0 auto;padding:12px 24px;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px}
.ah .l{display:flex;align-items:center;gap:14px}
.ah img{height:30px}
.tag{font-size:12px;font-weight:800;color:#fff;background:var(--gray);border-radius:6px;padding:3px 8px}
.anav{display:flex;flex-wrap:wrap;gap:4px}
.anav button{border:0;background:none;color:var(--gray);font-weight:700;font-size:14px;border-radius:8px;padding:9px 14px}
.anav button.on{color:var(--red);background:var(--red-soft)}
.am{max-width:1200px;width:100%;margin:0 auto;padding:22px 24px 48px;display:flex;flex-direction:column;gap:20px}
.am h1{margin:0;font-size:26px;font-weight:800}
.am h2{margin:0;font-size:17px;font-weight:800}
.sub{font-size:14px;color:var(--muted)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:14px;padding:15px;display:flex;flex-direction:column;gap:4px}
.kpi span{font-size:13px;font-weight:700;color:var(--muted)}
.kpi b{font-size:28px;font-weight:800;font-variant-numeric:tabular-nums}
.kpi.bad{background:var(--red-soft);border-color:#F3B7BC} .kpi.bad span,.kpi.bad b{color:var(--red-ink)}
.kpi.warn{background:var(--warn-soft);border-color:var(--warn-line)} .kpi.warn span,.kpi.warn b{color:var(--warn)}
.sec{display:flex;flex-direction:column;gap:12px}
.sech{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px}
.sech .t{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:16px}
.acard{background:#fff;border:1.5px solid var(--line);border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:13px;text-align:left;width:100%}
.acard:hover{border-color:#CFCFCF}
.acard .h{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.acard .n{font-size:18px;font-weight:800}
.acard .d{font-size:13px;color:var(--muted)}
.acard .bar{height:10px;border-radius:5px}
.acard .f{display:flex;justify-content:space-between;align-items:center;gap:12px;border-top:1px solid var(--line);padding-top:11px;font-size:13px;color:var(--muted)}
.acard .f b{flex:none;color:var(--red);white-space:nowrap}
.tbl{background:#fff;border:1px solid var(--line);border-radius:16px;overflow-x:auto}
.tbl table{width:100%;min-width:640px;border-collapse:collapse;font-size:13.5px}
.tbl th{text-align:left;color:var(--muted);font-size:12px;padding:10px 12px;border-bottom:1px solid var(--line)}
.tbl td{padding:11px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl th:first-child,.tbl td:first-child{padding-left:18px}
.tbl tr.click{cursor:pointer} .tbl tr.click:hover td{background:#FAFAFA}
.lnk{border:0;background:none;color:var(--red);font-weight:700;padding:0;font-size:13.5px}
.cols{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-start}
.cols>.main{flex:999 1 560px;min-width:0;display:flex;flex-direction:column;gap:16px}
.cols>.side{flex:1 1 320px;min-width:0;display:flex;flex-direction:column;gap:16px}
.box{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:11px}
.zgrid{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,3fr) 72px;gap:10px 14px;align-items:center;font-size:13.5px}
.zgrid b{text-align:right;font-variant-numeric:tabular-nums}
.feed{display:flex;gap:10px;padding:7px 0;border-bottom:1px solid var(--line);font-size:13px}
.feed:last-child{border-bottom:0}
.feed .tm{flex:none;width:42px;color:var(--muted)}
.trow{display:flex;align-items:center;gap:10px}
.trow .i{flex:1;display:flex;flex-direction:column;min-width:0}
.trow .i span{font-size:12.5px;color:var(--muted)}
.inline{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.searchA{position:relative}
.searchA svg{position:absolute;left:11px;top:11px;width:18px;height:18px;color:var(--muted)}
.searchA input{height:40px;width:260px;max-width:100%;border:1.5px solid var(--line);border-radius:10px;padding:0 12px 0 36px;font-size:14px;background:#fff;outline:none}
select.sm{height:40px;border:1.5px solid var(--line);border-radius:10px;padding:0 10px;font-size:14px;background:#fff}
.mrow{display:flex;flex-wrap:wrap;align-items:center;gap:14px;padding:14px 18px;border-bottom:1px solid var(--line)}
.mrow:last-child{border-bottom:0}
.mrow .i{flex:999 1 260px;min-width:0;display:flex;flex-direction:column;gap:3px;cursor:pointer}
.mrow .i b{font-size:15px}
.mrow .i span{font-size:12.5px;color:var(--muted)}
.mrow .p{flex:1 1 200px;display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:700}

/* ---------- Diálogos, aviso ---------- */
.gate,.dlg{position:fixed;inset:0;z-index:95;display:none;align-items:center;justify-content:center;padding:20px;background:rgba(0,0,0,.45)}
.gate{background:var(--bg);z-index:96}
.gate.on,.dlg.on{display:flex}
.gate .box,.dlg .box{background:#fff;border:1px solid var(--line);border-radius:16px;padding:20px;max-width:420px;width:100%;max-height:90vh;overflow-y:auto}
.gate img{height:34px;display:block;margin:0 auto 14px}
.box h2{margin:0 0 4px;font-size:18px;text-align:left}
.gate h2{text-align:center}
.box p{margin:0 0 14px;color:var(--muted);font-size:13.5px}
.gate p{text-align:center}
.box .btn{width:100%}
.dlg .acts{display:flex;gap:8px;justify-content:flex-end;margin-top:6px}
.dlg .acts .btn{width:auto}
.err{color:var(--red);font-size:13px;min-height:18px;margin-top:8px;text-align:center}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%) translateY(30px);background:var(--ink);color:#fff;padding:11px 16px;border-radius:12px;font-weight:600;font-size:14px;z-index:99;opacity:0;transition:all .2s;pointer-events:none;max-width:92vw;text-align:center}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.act{pointer-events:auto;display:flex;align-items:center;gap:12px;padding:8px 8px 8px 16px;white-space:nowrap}
.toast button{border:0;background:#fff;color:var(--ink);font-weight:800;border-radius:8px;padding:8px 12px;font-size:13px}
.busy{position:fixed;inset:0;z-index:98;background:rgba(255,255,255,.7);display:none;align-items:center;justify-content:center;font-weight:700}
